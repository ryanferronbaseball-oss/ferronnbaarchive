name: Banana Ball NCAA-MiLB-MLB crossover audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'college-baseball/scripts/audit_banana_ball_crossover.py'
      - '.github/workflows/banana-ball-crossover-audit.yml'
permissions:
  contents: write
concurrency:
  group: banana-ball-crossover-audit
  cancel-in-progress: true
jobs:
  banana-ball-crossmatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Find attended NCAA, MiLB and MLB players with Banana Ball appearances
        id: audit
        continue-on-error: true
        run: python -u college-baseball/scripts/audit_banana_ball_crossover.py --delay 0.4
      - name: Upload audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banana-ball-three-level-audit
          path: college-baseball/data/banana_ball_crossover_audit.json
          if-no-files-found: warn
      - name: Commit review-only candidate checkpoint
        if: always()
        run: |
          if test -f college-baseball/data/banana_ball_crossover_audit.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add college-baseball/data/banana_ball_crossover_audit.json
            if ! git diff --cached --quiet; then
              git commit -m "Record Banana Ball three-level appearance candidates"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Fail if evidence collection incomplete
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Banana Ball audit failed: only complete verified evidence can be used for tags." >&2
          exit 1
