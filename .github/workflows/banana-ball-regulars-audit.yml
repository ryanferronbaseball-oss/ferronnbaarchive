name: Banana Ball regular-roster crossover screening
on:
  workflow_dispatch:
  push:
    paths:
      - 'college-baseball/scripts/filter_banana_ball_regulars.py'
      - '.github/workflows/banana-ball-regulars-audit.yml'
permissions:
  contents: write
concurrency:
  group: banana-ball-regulars-screening
  cancel-in-progress: true
jobs:
  regular-members:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Exclude guest players and identify sustained team-stint candidates
        id: audit
        continue-on-error: true
        run: python -u college-baseball/scripts/filter_banana_ball_regulars.py
      - name: Upload review results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banana-ball-regular-roster-review
          path: college-baseball/data/banana_ball_regular_roster_audit.json
          if-no-files-found: warn
      - name: Save full-time eligibility review checkpoint
        if: always()
        run: |
          if test -f college-baseball/data/banana_ball_regular_roster_audit.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add college-baseball/data/banana_ball_regular_roster_audit.json
            if ! git diff --cached --quiet; then
              git commit -m "Screen Banana Ball crossovers for regular-team service, not cameos"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Fail incomplete screening
        if: steps.audit.outcome == 'failure'
        run: |
          echo "Regular-player screening incomplete; do not tag from this report without further verification." >&2
          exit 1
