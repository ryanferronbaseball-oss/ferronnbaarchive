name: College football sourced gamebook import
on:
  workflow_dispatch:
  push:
    paths:
      - "cfb/scripts/import_official.py"
      - ".github/workflows/cfb-import.yml"
jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install beautifulsoup4
      - name: Import official boxscores
        run: python cfb/scripts/import_official.py
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: cfb-import-audit
          path: cfb/data/import_report.json
      - name: Commit verified generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfb/data/player_stats.json cfb/data/scoring_plays.json cfb/data/fantasy_ppr.json cfb/data/import_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Import official gamebook stats and scoring for five attended CFB games"
            git push origin HEAD:main
          fi
