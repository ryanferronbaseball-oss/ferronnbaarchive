name: College Football archive browser QA
on:
  workflow_dispatch:
  push:
    paths:
      - "cfb/data/**"
      - "cfb/*.html"
      - "cfb/assets/**"
      - "cfb/scripts/test_cfb.py"
      - "index.html"
      - ".github/workflows/cfb-qa.yml"
jobs:
  cfb-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Test CFB history, full-PPR scoring, records and mobile views
        run: python cfb/scripts/test_cfb.py
