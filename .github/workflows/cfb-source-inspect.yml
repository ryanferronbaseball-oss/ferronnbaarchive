name: College football official source inspection
on:
  workflow_dispatch:
  push:
    paths:
      - "cfb/scripts/inspect_source.py"
      - "cfb/data/games.json"
      - ".github/workflows/cfb-source-inspect.yml"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install beautifulsoup4
      - run: python cfb/scripts/inspect_source.py
