name: College Baseball 2025 Official Source Backfill
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "college-baseball/data/2025_official_source_queue.json"
      - "college-baseball/scripts/import_2025_verified_queue.py"
      - "college-baseball/scripts/import_2025_lsu_regional_pdfs.py"
      - "college-baseball/scripts/import_2026_remaining_ncaa.py"
      - ".github/workflows/college-baseball-2025-backfill.yml"
permissions:
  contents: write
concurrency:
  group: college-baseball-2025-source-verification-draft
  cancel-in-progress: true
jobs:
  source-verify-and-import:
    if: github.event.pull_request.head.ref == 'feature/college-baseball-foundation' || github.ref == 'refs/heads/feature/college-baseball-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/college-baseball-foundation
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source reconciliation requirements
        run: python -m pip install requests beautifulsoup4 pymupdf
      - name: Source-verified 2025 gamebook import
        run: python college-baseball/scripts/import_2025_verified_queue.py
      - name: Reconcile LSU-hosted official 2025 regional PDF scorebooks
        run: python college-baseball/scripts/import_2025_lsu_regional_pdfs.py
      - name: Check source import audit and year boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d=Path('college-baseball/data')
          games=json.loads((d/'games.json').read_text())
          rows=json.loads((d/'player_stats.json').read_text())
          audit=json.loads((d/'2025_source_import_audit.json').read_text())
          assert len(games)==444
          assert len({g['id'] for g in games})==444
          assert audit['verified_2026_unchanged']==68
          assert sum(g['date'].startswith('2026') and g['verification']=='official_boxscore_verified' for g in games)==68
          assert sum(g['date'].startswith('2025') and g['verification']=='official_boxscore_verified' for g in games)>=audit['verified_2025_total']
          assert len({(r['game_id'],r['player_id']) for r in rows})==len(rows)
          assert all(g['verification']=='attendance_only' for g in games if g['date']<'2025')
          assert all(g['verification']=='attendance_only' for g in games if g.get('boxscore_backfill_excluded'))
          print('2025 SOURCE-GATED IMPORT',audit['completed_in_this_run'],'added;',
                audit['verified_2025_total'],'2025 verified;',
                len(audit['pending_review']),'source exceptions')
          PY
      - name: Commit reconciled 2025 scorebooks to draft only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/games.json college-baseball/data/player_stats.json college-baseball/data/import_report.json college-baseball/data/2025_source_import_audit.json college-baseball/data/2025_lsu_regional_pdf_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Import source-verified 2025 college baseball gamebooks"
            git push origin HEAD:feature/college-baseball-foundation
          else
            echo "No newly verifiable 2025 gamebooks in source queue"
          fi
      - name: Attach 2025 source and exception audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2025-official-source-audit
          path: |
            college-baseball/data/2025_source_import_audit.json
            college-baseball/data/2025_lsu_regional_pdf_audit.json
          if-no-files-found: warn
