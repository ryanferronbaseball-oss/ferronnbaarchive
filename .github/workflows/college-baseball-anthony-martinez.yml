name: Anthony Martinez college baseball identity merge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/merge_college_baseball_anthony_martinez.py', '.github/workflows/college-baseball-anthony-martinez.yml']
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m py_compile scripts/merge_college_baseball_anthony_martinez.py
      - run: python scripts/merge_college_baseball_anthony_martinez.py
      - name: Commit scoped merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_identity_crosswalk.json college-baseball/data/identity_anthony_martinez_merge.json
          git commit -m "Combine Anthony Martinez and Tony Martinez in college baseball"
          git pull --rebase origin main
          git push origin HEAD:main
