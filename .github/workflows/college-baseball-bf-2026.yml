name: College Baseball BF 2026
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/college-baseball-bf-2026.yml', 'college-baseball/scripts/backfill_bf_2026.py']
permissions:
  contents: write
concurrency:
  group: college-baseball-bf-2026
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python college-baseball/scripts/backfill_bf_2026.py
      - name: Commit verified data and game-level audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_stats.json college-baseball/data/bf_audit_2026.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover verified college baseball BF for 2026"
          git pull --rebase origin main
          git push origin HEAD:main
