name: College Baseball manual BF recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/college-baseball-bf-manual.yml']
permissions:
  contents: write
concurrency:
  group: college-baseball-bf-manual
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply verified May 16 2026 Arkansas Kentucky BF
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          D=Path('college-baseball/data')
          stats=D/'player_stats.json'
          audit=D/'bf_audit_recovery.json'
          rows=json.loads(stats.read_text())
          report=json.loads(audit.read_text())
          gid='cb-2026-05-16-arkansas-kentucky-att0424'
          source='https://arkansasrazorbacks.com/stats/baseball/2026/ARK55.pdf'
          game=next(g for g in json.loads((D/'games.json').read_text()) if g['id']==gid)
          assert (game['date'],game['away'],game['home'],game['away_score'],game['home_score'])==('2026-05-16','Arkansas','Kentucky',16,12)
          seeds=[
              ('Arkansas','Tate McGuire',(7,2,2,2,1,4,46),10),
              ('Arkansas','Cole Gibler',(6,7,7,7,2,3,52),15),
              ('Arkansas','Steele Eaves',(0,3,3,1,0,0,12),3),
              ('Arkansas','Parker Coil',(5,3,0,0,0,1,18),8),
              ('Arkansas','James DeCremer',(9,2,0,0,0,2,34),12),
              ('Kentucky','Connor Mattison',(0,5,6,6,1,0,22),6),
              ('Kentucky','Toby Peterson',(0,1,3,3,1,0,11),3),
              ('Kentucky','Ira Austin IV',(3,2,1,1,1,2,27),7),
              ('Kentucky','Ryan Mullan',(3,0,0,0,0,1,17),3),
              ('Kentucky','Will Coleman',(3,1,1,1,1,1,23),7),
              ('Kentucky','Chase Alderman',(3,1,1,1,0,1,17),4),
              ('Kentucky','Bryson Treichel',(3,0,0,0,0,1,13),3),
              ('Kentucky','Tristan Hunter',(0,0,2,2,2,0,14),2),
              ('Kentucky','Jack Bennett',(12,4,2,2,1,6,68),18),
          ]
          arms=[r for r in rows if r['game_id']==gid and r.get('pitching') is not None]
          entry=next(r for r in report['games'] if r['game_id']==gid)
          assert len(arms)==len(seeds),[(r['player'],r['pitching']) for r in arms]
          fields=('outs','hits','runs','earnedRuns','baseOnBalls','strikeOuts','numberOfPitches')
          norm=lambda s:re.sub(r'[^a-z0-9]','',s.lower())
          values=[]; added=0; used=set()
          for team,name,sig,bf in seeds:
              matches=[r for r in arms if r['team']==team and tuple(r['pitching'].get(k) for k in fields)==sig]
              assert len(matches)==1,(name,[(r['player'],r['pitching']) for r in arms if r['team']==team])
              r=matches[0]; p=r['pitching']
              a,b=norm(r['player']),norm(name)
              assert a==b or (min(len(a),len(b))>=10 and (a.startswith(b) or b.startswith(a))) or (a,b) in {('iraustin','iraaustiniv'),('iraaustin','iraaustiniv'),('tobiaspeterson','tobypeterson'),('jacksonbennett','jackbennett')} or a==norm(name.split()[0][0]+name.split()[1]),(name,r['player'])
              assert r['player_id'] not in used
              used.add(r['player_id'])
              assert p.get('battersFaced') in (None,bf)
              if p.get('battersFaced') is None:
                  p['battersFaced']=bf; added+=1
              values.append({'player_id':r['player_id'],'team':team,'BF':bf})
              print(r['player'],bf,'K%',round(100*p['strikeOuts']/bf,1),'BB%',round(100*p['baseOnBalls']/bf,1))
          assert sum(v['BF'] for v in values if v['team']=='Arkansas')==48==44+3+1
          assert sum(v['BF'] for v in values if v['team']=='Kentucky')==53==41+7+5
          if entry['status']=='recovered':
              assert entry['values']==values and added==0
              print('Already verified and saved')
              raise SystemExit(0)
          assert entry['status']=='unresolved'
          entry.pop('reason',None)
          entry.update(status='recovered',method='Manual official Arkansas PDF, page 1; explicit BF and exact pitching signatures; Kentucky abbreviated names matched to official roster; opposing batting totals reconciled',manual_source_url=source,verification={'Arkansas':{'BF':48,'opponent_AB':44,'opponent_BB':3,'opponent_HBP':1},'Kentucky':{'BF':53,'opponent_AB':41,'opponent_BB':7,'opponent_HBP':5}},pitchers=14,added=added,recovered_this_run=added,values=values)
          stats.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          audit.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('Added:',added,'Remaining unresolved:',sum(r['status']=='unresolved' for r in report['games']))
          PY
      - name: Commit verified game and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_stats.json college-baseball/data/bf_audit_recovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover verified BF for May 16 2026 Arkansas Kentucky"
          git pull --rebase origin main
          git push origin HEAD:main
