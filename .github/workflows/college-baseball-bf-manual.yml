name: College Baseball manual BF recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/college-baseball-bf-manual.yml']
permissions:
  contents: write
concurrency:
  group: college-baseball-bf-manual
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply verified April 11 2026 ETSU Belmont game 1 BF
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          D=Path('college-baseball/data')
          stats=D/'player_stats.json'
          audit=D/'bf_audit_recovery.json'
          rows=json.loads(stats.read_text())
          report=json.loads(audit.read_text())
          gid='cb-2026-04-11-east-tennessee-state-belmont-att0411'
          source='https://belmontbruins.com/sports/baseball/stats/2026/east-tennessee-state/boxscore/7031'
          game=next(g for g in json.loads((D/'games.json').read_text()) if g['id']==gid)
          assert (game['date'],game['away'],game['home'],game['away_score'],game['home_score'])==('2026-04-11','East Tennessee State','Belmont',8,4)
          assert game['game_number']==1
          seeds=[
              ('East Tennessee State','Michael Harpster',(17,4,0,0,2,10,89),24),
              ('East Tennessee State','Derek McCarley',(2,3,4,4,1,2,16),6),
              ('East Tennessee State','Tyler Kropis',(2,0,0,0,0,0,7),2),
              ('Belmont','Ridge Harvey',(18,8,6,4,0,5,81),26),
              ('Belmont','Aubrey Moraitakis',(3,3,2,1,1,1,32),7),
          ]
          arms=[r for r in rows if r['game_id']==gid and r.get('pitching') is not None]
          entry=next(r for r in report['games'] if r['game_id']==gid)
          assert len(arms)==len(seeds),[(r['player'],r['pitching']) for r in arms]
          fields=('outs','hits','runs','earnedRuns','baseOnBalls','strikeOuts','numberOfPitches')
          norm=lambda s:re.sub(r'[^a-z0-9]','',s.lower())
          values=[]; added=0; used=set()
          for team,name,sig,bf in seeds:
              matches=[r for r in arms if r['team']==team and tuple(r['pitching'].get(k) for k in fields)==sig]
              assert len(matches)==1,(name,[(r['player'],r['pitching']) for r in arms if r['team']==team])
              r=matches[0]; p=r['pitching']
              a,b=norm(r['player']),norm(name)
              assert a==b or (min(len(a),len(b))>=10 and (a.startswith(b) or b.startswith(a))),(name,r['player'])
              assert r['player_id'] not in used
              used.add(r['player_id'])
              assert p.get('battersFaced') in (None,bf)
              if p.get('battersFaced') is None:
                  p['battersFaced']=bf; added+=1
              values.append({'player_id':r['player_id'],'team':team,'BF':bf})
              print(r['player'],bf,'K%',round(100*p['strikeOuts']/bf,1),'BB%',round(100*p['baseOnBalls']/bf,1))
          assert sum(v['BF'] for v in values if v['team']=='East Tennessee State')==32==27+3+1+1
          assert sum(v['BF'] for v in values if v['team']=='Belmont')==33==30+1+2
          if entry['status']=='recovered':
              assert entry['values']==values and added==0
              print('Already verified and saved')
              raise SystemExit(0)
          assert entry['status']=='unresolved'
          entry.pop('reason',None)
          entry.update(status='recovered',method='Manual official Belmont HTML game 1; exact pitching signatures and names matched; explicit BF reconciled against opponent batting in Belmont source; existing batting statistics preserved',manual_source_url=source,verification={'East Tennessee State':{'BF':32,'opponent_AB':27,'opponent_BB':3,'opponent_HBP':1,'opponent_SF':1},'Belmont':{'BF':33,'opponent_AB':30,'opponent_BB':1,'opponent_SF':2}},pitchers=5,added=added,recovered_this_run=added,values=values)
          stats.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          audit.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('Added:',added,'Remaining unresolved:',sum(r['status']=='unresolved' for r in report['games']))
          PY
      - name: Commit verified game and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_stats.json college-baseball/data/bf_audit_recovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover verified BF for April 11 2026 ETSU Belmont game 1"
          git pull --rebase origin main
          git push origin HEAD:main
