name: College Baseball manual BF recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/college-baseball-bf-manual.yml']
permissions:
  contents: write
concurrency:
  group: college-baseball-bf-manual
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply verified March 1 2026 Notre Dame Tennessee Tech BF
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          D=Path('college-baseball/data')
          stats=D/'player_stats.json'
          audit=D/'bf_audit_recovery.json'
          rows=json.loads(stats.read_text())
          report=json.loads(audit.read_text())
          gid='cb-2026-03-01-notre-dame-tennessee-tech-att0383'
          source='https://storage.googleapis.com/fightingirish-com/2026/03/3126_ND.pdf'
          game=next(g for g in json.loads((D/'games.json').read_text()) if g['id']==gid)
          assert (game['date'],game['away'],game['home'],game['away_score'],game['home_score'])==('2026-03-01','Notre Dame','Tennessee Tech',11,0)
          seeds=[
              ('Notre Dame','Ty Uber',(15,2,0,0,2,2,74),18),
              ('Notre Dame','Kellan Klosterman',(2,0,0,0,1,1,19),3),
              ('Notre Dame','Eli Thurmond',(4,0,0,0,0,0,11),4),
              ('Notre Dame','Dylan Singleton',(3,0,0,0,0,1,11),3),
              ('Tennessee Tech','Logan Moller',(12,1,0,0,1,5,50),13),
              ('Tennessee Tech','Carter Casabella',(7,7,2,2,0,1,45),13),
              ('Tennessee Tech','Eli Huddleston',(0,0,1,1,1,0,9),1),
              ('Tennessee Tech','Reece McDuffie',(4,5,5,5,1,0,32),10),
              ('Tennessee Tech','Micah Summar',(0,3,3,3,1,0,16),4),
              ('Tennessee Tech','Carson Davis',(1,0,0,0,0,0,7),1),
          ]
          arms=[r for r in rows if r['game_id']==gid and r.get('pitching') is not None]
          entry=next(r for r in report['games'] if r['game_id']==gid)
          assert len(arms)==len(seeds),[(r['player'],r['pitching']) for r in arms]
          fields=('outs','hits','runs','earnedRuns','baseOnBalls','strikeOuts','numberOfPitches')
          norm=lambda s:re.sub(r'[^a-z0-9]','',s.lower())
          values=[]; added=0; used=set()
          for team,name,sig,bf in seeds:
              matches=[r for r in arms if r['team']==team and tuple(r['pitching'].get(k) for k in fields)==sig]
              assert len(matches)==1,(name,[(r['player'],r['pitching']) for r in arms if r['team']==team])
              r=matches[0]; p=r['pitching']
              a,b=norm(r['player']),norm(name)
              assert a==b or (min(len(a),len(b))>=10 and (a.startswith(b) or b.startswith(a))),(name,r['player'])
              assert r['player_id'] not in used
              used.add(r['player_id'])
              assert p.get('battersFaced') in (None,bf)
              if p.get('battersFaced') is None:
                  p['battersFaced']=bf; added+=1
              values.append({'player_id':r['player_id'],'team':team,'BF':bf})
              print(r['player'],bf,'K%',round(100*p['strikeOuts']/bf,1),'BB%',round(100*p['baseOnBalls']/bf,1))
          assert sum(v['BF'] for v in values if v['team']=='Notre Dame')==28==25+3
          assert sum(v['BF'] for v in values if v['team']=='Tennessee Tech')==42==36+4+1+1
          if entry['status']=='recovered':
              assert entry['values']==values and added==0
              print('Already verified and saved')
              raise SystemExit(0)
          assert entry['status']=='unresolved'
          entry.pop('reason',None)
          entry.update(status='recovered',method='Manual official PDF gamebook; date and score confirmed; exact pitcher names and pitching signatures matched; BF reconciled against opponent batting',manual_source_url=source,verification={'Notre Dame':{'BF':28,'opponent_AB':25,'opponent_BB':3},'Tennessee Tech':{'BF':42,'opponent_AB':36,'opponent_BB':4,'opponent_SH':1,'opponent_SF':1}},pitchers=10,added=added,recovered_this_run=added,values=values)
          stats.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          audit.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('Added:',added,'Remaining unresolved:',sum(r['status']=='unresolved' for r in report['games']))
          PY
      - name: Commit verified game and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_stats.json college-baseball/data/bf_audit_recovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover verified BF for March 1 2026 Notre Dame Tennessee Tech"
          git pull --rebase origin main
          git push origin HEAD:main
