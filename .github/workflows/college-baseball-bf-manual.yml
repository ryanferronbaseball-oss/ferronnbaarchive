name: College Baseball manual BF recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/college-baseball-bf-manual.yml']
permissions:
  contents: write
concurrency:
  group: college-baseball-bf-manual
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply verified May 22 2026 Auburn Texas A&M BF
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          D=Path('college-baseball/data')
          stats=D/'player_stats.json'
          audit=D/'bf_audit_recovery.json'
          rows=json.loads(stats.read_text())
          report=json.loads(audit.read_text())
          gid='cb-2026-05-22-auburn-texas-a-m-att0436'
          source='https://storage.googleapis.com/auburn-prod/2026/05/23/B1yXyMnFNLlPuQs4IZQC4WYlQNbHmcsWGsihLulK.pdf'
          game=next(g for g in json.loads((D/'games.json').read_text()) if g['id']==gid)
          assert (game['date'],game['away'],game['home'],game['away_score'],game['home_score'])==('2026-05-22','Auburn','Texas A&M',7,0)
          seeds=[
              ('Auburn','Andreas Alvarez',(15,1,0,0,4,9,98),19),
              ('Auburn','LJ Cormier',(12,1,0,0,1,4,62),15),
              ('Texas A&M','Ethan Darden',(3,5,4,4,1,2,33),9),
              ('Texas A&M','Gavin Lyons',(12,2,1,1,0,5,54),15),
              ('Texas A&M','Shane Sdao',(6,4,2,2,1,3,52),11),
              ('Texas A&M','Weston Moss',(3,0,0,0,0,1,19),3),
              ('Texas A&M','Clayton Freshcorn',(3,0,0,0,0,0,14),3),
          ]
          arms=[r for r in rows if r['game_id']==gid and r.get('pitching') is not None]
          entry=next(r for r in report['games'] if r['game_id']==gid)
          assert len(arms)==len(seeds),[(r['player'],r['pitching']) for r in arms]
          fields=('outs','hits','runs','earnedRuns','baseOnBalls','strikeOuts','numberOfPitches')
          norm=lambda s:re.sub(r'[^a-z0-9]','',s.lower())
          values=[]; added=0; used=set()
          for team,name,sig,bf in seeds:
              matches=[r for r in arms if r['team']==team and tuple(r['pitching'].get(k) for k in fields)==sig]
              assert len(matches)==1,(name,[(r['player'],r['pitching']) for r in arms if r['team']==team])
              r=matches[0]; p=r['pitching']
              a,b=norm(r['player']),norm(name)
              assert a==b or (min(len(a),len(b))>=10 and (a.startswith(b) or b.startswith(a))) or (a,b) in {('iraustin','iraaustiniv'),('iraaustin','iraaustiniv'),('tobiaspeterson','tobypeterson'),('jacksonbennett','jackbennett')} or a==norm(name.split()[0][0]+name.split()[1]),(name,r['player'])
              assert r['player_id'] not in used
              used.add(r['player_id'])
              assert p.get('battersFaced') in (None,bf)
              if p.get('battersFaced') is None:
                  p['battersFaced']=bf; added+=1
              values.append({'player_id':r['player_id'],'team':team,'BF':bf})
              print(r['player'],bf,'K%',round(100*p['strikeOuts']/bf,1),'BB%',round(100*p['baseOnBalls']/bf,1))
          assert sum(v['BF'] for v in values if v['team']=='Auburn')==34==28+5+1
          assert sum(v['BF'] for v in values if v['team']=='Texas A&M')==41==37+2+1+1
          if entry['status']=='recovered':
              assert entry['values']==values and added==0
              print('Already verified and saved')
              raise SystemExit(0)
          assert entry['status']=='unresolved'
          entry.pop('reason',None)
          entry.update(status='recovered',method='Manual official Auburn PDF page 1; exact pitcher signatures and names confirmed with official Texas A&M roster; explicit BF reconciled against opposing batting totals',manual_source_url=source,corroborating_source_url='https://auburntigers.com/boxscore/31134',roster_source_url='https://12thman.com/sports/baseball/roster/season/2026',verification={'Auburn':{'BF':34,'opponent_AB':28,'opponent_BB':5,'opponent_HBP':1},'Texas A&M':{'BF':41,'opponent_AB':37,'opponent_BB':2,'opponent_HBP':1,'opponent_SH':1}},pitchers=7,added=added,recovered_this_run=added,values=values)
          stats.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          audit.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('Added:',added,'Remaining unresolved:',sum(r['status']=='unresolved' for r in report['games']))
          PY
      - name: Commit verified game and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_stats.json college-baseball/data/bf_audit_recovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover verified BF for May 22 2026 Auburn Texas A&M"
          git pull --rebase origin main
          git push origin HEAD:main
