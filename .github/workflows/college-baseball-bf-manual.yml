name: College Baseball manual BF recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/college-baseball-bf-manual.yml']
permissions:
  contents: write
concurrency:
  group: college-baseball-bf-manual
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply verified April 4 2026 Missouri Kentucky BF
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          D=Path('college-baseball/data')
          stats=D/'player_stats.json'
          audit=D/'bf_audit_recovery.json'
          rows=json.loads(stats.read_text())
          report=json.loads(audit.read_text())
          gid='cb-2026-04-04-missouri-kentucky-att0405'
          source='https://storage.googleapis.com/ukathletics-com/2026/04/e955fadd-0404_miz-box-g2.pdf'
          game=next(g for g in json.loads((D/'games.json').read_text()) if g['id']==gid)
          assert (game['date'],game['away'],game['home'],game['away_score'],game['home_score'])==('2026-04-04','Missouri','Kentucky',2,9)
          seeds=[
              ('Missouri','Brady Kehlenbrink',(10,6,8,7,5,0,88),22),
              ('Missouri','Luke Sullivan',(12,2,1,0,1,2,55),15),
              ('Missouri','Isaiah Salas',(2,1,0,0,0,2,16),3),
              ('Kentucky','Nate Harris',(15,5,2,2,1,3,85),21),
              ('Kentucky','Ryan Mullan',(3,0,0,0,0,1,7),2),
              ('Kentucky','Ira Austin IV',(3,1,0,0,0,0,12),4),
              ('Kentucky','Leighton Harris',(3,1,0,0,0,0,5),3),
              ('Kentucky','Tristan Hunter',(3,0,0,0,0,2,12),3),
          ]
          arms=[r for r in rows if r['game_id']==gid and r.get('pitching') is not None]
          entry=next(r for r in report['games'] if r['game_id']==gid)
          assert len(arms)==len(seeds),[(r['player'],r['pitching']) for r in arms]
          fields=('outs','hits','runs','earnedRuns','baseOnBalls','strikeOuts','numberOfPitches')
          norm=lambda s:re.sub(r'[^a-z0-9]','',s.lower())
          values=[]; added=0; used=set()
          for team,name,sig,bf in seeds:
              matches=[r for r in arms if r['team']==team and tuple(r['pitching'].get(k) for k in fields)==sig]
              assert len(matches)==1,(name,[(r['player'],r['pitching']) for r in arms if r['team']==team])
              r=matches[0]; p=r['pitching']
              a,b=norm(r['player']),norm(name)
              assert a==b or (min(len(a),len(b))>=10 and (a.startswith(b) or b.startswith(a))),(name,r['player'])
              assert r['player_id'] not in used
              used.add(r['player_id'])
              assert p.get('battersFaced') in (None,bf)
              if p.get('battersFaced') is None:
                  p['battersFaced']=bf; added+=1
              values.append({'player_id':r['player_id'],'team':team,'BF':bf})
              print(r['player'],bf,'K%',round(100*p['strikeOuts']/bf,1),'BB%',round(100*p['baseOnBalls']/bf,1))
          assert sum(v['BF'] for v in values if v['team']=='Missouri')==40==31+6+3
          assert sum(v['BF'] for v in values if v['team']=='Kentucky')==33==32+1
          if entry['status']=='recovered':
              assert entry['values']==values and added==0
              print('Already verified and saved')
              raise SystemExit(0)
          assert entry['status']=='unresolved'
          entry.pop('reason',None)
          entry.update(status='recovered',method='Manual official Kentucky PDF; printed year typo confirmed by both official April 4 2026 recaps; exact pitching signatures and names matched; opposing PA reconciled',manual_source_url=source,date_verification_source_urls=['https://ukathletics.com/news/2026/04/04/junior-day-scott-campbell-jr-shows-out-in-saturday-matinee-win/','https://mutigers.com/news/2026/04/4/baseball-drops-game-two-at-no-24-kentucky-to-set-up-sunday-rubber-match'],verification={'Missouri':{'BF':40,'opponent_AB':31,'opponent_BB':6,'opponent_HBP':3},'Kentucky':{'BF':33,'opponent_AB':32,'opponent_BB':1}},pitchers=8,added=added,recovered_this_run=added,values=values)
          stats.write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n')
          audit.write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('Added:',added,'Remaining unresolved:',sum(r['status']=='unresolved' for r in report['games']))
          PY
      - name: Commit verified game and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_stats.json college-baseball/data/bf_audit_recovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover verified BF for April 4 2026 Missouri Kentucky"
          git pull --rebase origin main
          git push origin HEAD:main
