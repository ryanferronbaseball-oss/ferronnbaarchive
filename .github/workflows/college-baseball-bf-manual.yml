name: College Baseball manual BF recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/college-baseball-bf-manual.yml']
permissions:
  contents: write
concurrency:
  group: college-baseball-bf-manual
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply verified March 11 2020 game and correct date
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          D=Path('college-baseball/data')
          stats=D/'player_stats.json'
          audit=D/'bf_audit_recovery.json'
          gamesfile=D/'games.json'
          initial=D/'bf_audit_2020_2021.json'
          attendance=D/'attendance_master_444.csv'
          rows=json.loads(stats.read_text())
          report=json.loads(audit.read_text())
          games=json.loads(gamesfile.read_text())
          initial_report=json.loads(initial.read_text())
          gid='cb-2020-03-10-cal-baptist-san-diego-att0083'
          source='https://usdtoreros.com/sports/baseball/stats/2020/california-baptist/boxscore/9683'
          old_date='2020-03-10'
          date='2020-03-11'
          seeds=[
              ('cb-cal-baptist-chris-burica',(16,8,2,2,2,3,84,1),27),
              ('cb-cal-baptist-christian-culpepper',(5,0,0,0,2,2,30,0),7),
              ('cb-cal-baptist-jorge-valerio',(3,0,0,0,0,1,14,0),3),
              ('cb-san-diego-jack-dolak',(18,0,0,0,3,10,103,0),20),
              ('cb-san-diego-jake-reed',(5,2,0,0,1,1,24,0),8),
              ('cb-san-diego-conner-thurman',(4,0,0,0,0,2,14,0),4),
          ]
          arms=[r for r in rows if r['game_id']==gid and r.get('pitching') is not None]
          entry=next(r for r in report['games'] if r['game_id']==gid)
          game=next(r for r in games if r['id']==gid)
          prior=next(r for r in initial_report['games'] if r['game_id']==gid)
          assert len(arms)==6
          assert (game['away'],game['home'],game['away_score'],game['home_score'],game['source_url'])==('Cal Baptist','San Diego',0,2,source)
          assert game['date'] in (old_date,date)
          assert entry['date'] in (old_date,date)
          assert prior['date'] in (old_date,date)
          fields=('outs','hits','runs','earnedRuns','baseOnBalls','strikeOuts','numberOfPitches','hitBatsmen')
          values=[]; added=0
          for pid,sig,bf in seeds:
              matches=[r for r in arms if r['player_id']==pid]
              assert len(matches)==1,pid
              r=matches[0]; p=r['pitching']
              assert tuple(p[k] for k in fields)==sig,(pid,p)
              assert p.get('battersFaced') in (None,bf)
              if p.get('battersFaced') is None:
                  p['battersFaced']=bf; added+=1
              values.append({'player_id':pid,'team':r['team'],'BF':bf})
              print(r['player'],bf,'K%',round(100*p['strikeOuts']/bf,1),'BB%',round(100*p['baseOnBalls']/bf,1))
          assert sum(v['BF'] for v in values if v['team']=='Cal Baptist')==37==32+4+1
          assert sum(v['BF'] for v in values if v['team']=='San Diego')==32==28+4
          if entry['status']=='recovered':
              assert entry['values']==values and added==0 and game['date']==date
              print('Already verified and saved')
              raise SystemExit(0)
          assert entry['status']=='unresolved' and added==6
          game['date']=date
          prior['date']=date
          entry.pop('reason',None)
          entry.update(date=date,original_archive_date=old_date,status='recovered',method='Manual verification of official USD box score dated March 11, 2020; corrected date; exact pitcher BF and opponent plate appearances',manual_source_url=source,verification={'Cal Baptist':{'BF':37,'opponent_AB':32,'opponent_BB':4,'opponent_HBP':1},'San Diego':{'BF':32,'opponent_AB':28,'opponent_BB':4,'opponent_HBP':0}},pitchers=6,added=added,recovered_this_run=added,values=values)
          csv=attendance.read_bytes()
          old=b'cb-attended-0083,84,2020-03-10,Cal Baptist,San Diego,'
          new=b'cb-attended-0083,84,2020-03-11,Cal Baptist,San Diego,'
          assert csv.count(old)+csv.count(new)==1
          attendance.write_bytes(csv.replace(old,new))
          for path,data in [(stats,rows),(audit,report),(gamesfile,games),(initial,initial_report)]:
              path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print('Remaining unresolved:',sum(r['status']=='unresolved' for r in report['games']))
          PY
      - name: Commit verified BF and date correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_stats.json college-baseball/data/bf_audit_recovery.json college-baseball/data/games.json college-baseball/data/bf_audit_2020_2021.json college-baseball/data/attendance_master_444.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover six verified BF entries and correct CBU USD game date to March 11 2020"
          git pull --rebase origin main
          git push origin HEAD:main
