name: Caden Connor college baseball identity merge
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/merge_college_baseball_caden_connor.py', '.github/workflows/college-baseball-caden-connor.yml']
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/merge_college_baseball_caden_connor.py
      - name: Commit scoped merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_identity_crosswalk.json college-baseball/data/identity_caden_connor_merge.json
          git commit -m "Combine Caden Connor and Connor Caden in college baseball"
          git pull --rebase origin main
          git push origin HEAD:main
