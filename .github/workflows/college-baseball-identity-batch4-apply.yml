name: Apply College Baseball Batch 4 Approved Identities
on:
  push:
    paths:
      - college-baseball/scripts/apply_identity_batch4.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source-scoped decisions
        run: python college-baseball/scripts/apply_identity_batch4.py
      - name: Validate every existing player profile
        run: python college-baseball/scripts/test_current_identity_integrity.py
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_identity_crosswalk.json college-baseball/data/player_identity_reconciliation_audit.json college-baseball/data/identity_audit_batch_04_decisions.json
          if ! git diff --cached --quiet; then
            git commit -m "Apply verified Batch 4 name merges and preserve separate decisions"
            git push
          fi
