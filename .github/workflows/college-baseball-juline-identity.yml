name: Resolve Taylor Juline approved identity
on:
  push:
    paths:
      - college-baseball/scripts/resolve_juline_identity.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and map T Juline to Taylor
        run: python college-baseball/scripts/resolve_juline_identity.py
      - name: Run identity integrity checks
        run: python college-baseball/scripts/test_current_identity_integrity.py
      - name: Commit scoped mapping and preserved decisions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_identity_crosswalk.json college-baseball/data/player_identity_reconciliation_audit.json college-baseball/data/identity_audit_batch_03_decisions.json
          if ! git diff --cached --quiet; then
            git commit -m "Confirm T Juline as Taylor Juline, preserve Tucker profile"
            git push
          fi
