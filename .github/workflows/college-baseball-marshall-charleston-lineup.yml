name: Repair 2024 Marshall Charleston Lineup Names
on:
  push:
    paths:
      - college-baseball/scripts/repair_marshall_charleston_2024_lineup_names.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate and apply 23 full-name corrections
        run: python college-baseball/scripts/repair_marshall_charleston_2024_lineup_names.py
      - name: Check all player identity integrity
        run: python college-baseball/scripts/test_current_identity_integrity.py
      - name: Publish scoped verified full-name corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_name_corrections.json college-baseball/data/lineup_name_fix_marshall_charleston_2024_02_19.json
          if ! git diff --cached --quiet; then
            git commit -m "Resolve 23 Marshall at Charleston 2024 lineup names from team rosters"
            git push
          fi
