name: College baseball MLB portrait audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/audit_college_baseball_mlb_portraits.py', '.github/workflows/college-baseball-mlb-portraits.yml']
permissions:
  contents: write
concurrency:
  group: college-baseball-portraits
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow
      - run: python scripts/audit_college_baseball_mlb_portraits.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: college-baseball-mlb-portrait-audit
          path: college-baseball/data/player_portrait_audit.json
      - name: Publish verified portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_portraits.json college-baseball/data/player_portrait_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add verified MLB alumni portraits to college baseball profiles"
          git pull --rebase origin main
          git push origin HEAD:main
