name: College Baseball Foundation QA
on:
  workflow_dispatch:
  push:
    paths:
      - "college-baseball/**"
      - ".github/workflows/college-baseball-qa.yml"
  pull_request:
    paths:
      - "college-baseball/**"
      - ".github/workflows/college-baseball-qa.yml"
jobs:
  college-baseball:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test framework
        run: python -m pip install --disable-pip-version-check playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify synthetic import, no invented games, responsive baseball UI
        run: python college-baseball/scripts/test_college_baseball.py
      - name: Confirm empty attendance input validates without populating false games
        run: python college-baseball/scripts/import_attendance.py --validate-only
      - name: Attach college baseball six-game pilot screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: college-baseball-six-game-review
          path: college-baseball/output/regional-pilot-review/
          if-no-files-found: warn
