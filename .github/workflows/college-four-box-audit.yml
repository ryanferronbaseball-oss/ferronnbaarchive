name: College four official boxscore audit
on:
  push:
    branches: [college-import-pilot]
    paths: [".github/workflows/college-four-box-audit.yml"]
  workflow_dispatch:
jobs:
  official-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pymupdf
      - name: Read official player tables and Life Pacific PDF
        run: |
          python - <<'PY'
          import requests, re, fitz, json, os
          os.makedirs("four-box-audit",exist_ok=True)
          allrows={}
          from bs4 import BeautifulSoup
          urls={
           "hofstra":"https://usdtoreros.com/sports/mens-basketball/stats/2019-20/hofstra/boxscore/9522",
           "santa_clara":"https://usdtoreros.com/sports/mens-basketball/stats/2019-20/santa-clara/boxscore/9536",
           "cal_poly":"https://usdtoreros.com/sports/mens-basketball/stats/2021-22/cal-poly/boxscore/12411"
          }
          h={"User-Agent":"Mozilla/5.0"}
          for key,url in urls.items():
            try:
              response=requests.get(url,headers=h,timeout=24)
              soup=BeautifulSoup(response.text,"html.parser")
              print("OFFICIAL_URL",key,response.status_code,response.url,flush=True)
              print("OFFICIAL_TITLE",key,soup.title.get_text(" ",strip=True) if soup.title else "-",flush=True)
              print("OFFICIAL_SCORE",key,[tag.get_text(" ",strip=True)[:100] for tag in soup.select("h2,h3") if re.search("Hofstra|Santa Clara|Cal Poly|San Diego",tag.get_text(" ",strip=True),re.I)][:8],flush=True)
              for tr in soup.select("tr"):
                cells=[v.get_text(" ",strip=True) for v in tr.select("td,th")]
                if len(cells)>=12 and (any(re.fullmatch(r"\d+-\d+",v) for v in cells) or any(v=="Totals" for v in cells)):
                  print("OFFICIAL_ROW",key,repr(cells[:21]),flush=True)
                  allrows.setdefault(key,[]).append(cells)
            except Exception as ex:print("OFFICIAL_ERROR",key,repr(ex),flush=True)
          urls=[
            "https://s3.us-east-2.amazonaws.com/sidearm.nextgen.sites/usdtoreros.com/documents/2018/5/10/13853__m_baskbl_2017_18_misc_non_event__USDvsLPCbox.pdf",
            "https://usdtoreros.com/documents/2018/5/10/13853__m_baskbl_2017_18_misc_non_event__USDvsLPCbox.pdf",
          ]
          for url in urls:
            try:
              resp=requests.get(url,headers=h,timeout=20)
              print("OFFICIAL_PDF",resp.status_code,resp.url,len(resp.content),resp.headers.get("Content-Type"),flush=True)
              if resp.content[:4]==b"%PDF":
                open("four-box-audit/life_pacific_official.pdf","wb").write(resp.content)
                pdf=fitz.open(stream=resp.content,filetype="pdf")
                print("OFFICIAL_PDF_PAGES",len(pdf),flush=True)
                for i,page in enumerate(pdf):
                  print("PDF_TEXT_BEGIN",i,page.get_text("text")[:13500], "PDF_TEXT_END",flush=True)
                break
            except Exception as e:print("OFFICIAL_PDF_ERROR",repr(e),flush=True)
          open("four-box-audit/official_player_tables.json","w").write(json.dumps(allrows,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: college-four-source-data
          path: four-box-audit/