name: College last four official source audit
on:
  push:
    branches: [college-import-pilot]
    paths:
      - ".github/workflows/college-last-four-source-audit.yml"
  workflow_dispatch:
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Extract official tables for remaining four attended games
        run: |
          python - <<'PY'
          import os,json,re,requests
          from bs4 import BeautifulSoup
          os.makedirs("official-audit",exist_ok=True)
          sources={
             31: ("https://ucirvinesports.com/sports/mens-basketball/stats/2019/eastern-mich-/boxscore/6331","2019-11-30","Eastern Michigan @ UC Irvine"),
             49: ("https://bigwest.org/boxscore.aspx?id=JcLFfL9RUu0H5ystoOMbjVYg6D0KfPp31nT122ARuneT2vycwtveFRCctcGElibpWiSwNGM89sokk%2F2x5I%2F%2FsVR4SNoI5Zlyj4atEIDl3QLCZKDRPCOwrEmZsXGQLvnu6Zj2X6ZZeU2ykr9SueRFLpyy1Dw4GdzlnCAWJ%2FSkTcY%3D&path=mbball","2021-12-08","Cal State Fullerton @ San Diego State"),
             64: ("https://denverpioneers.com/sports/mens-basketball/stats/2022-23/ucla/boxscore/12495","2022-12-10","Denver @ UCLA"),
             71: ("https://utahstateaggies.com/sports/mens-basketball/stats/2022-23/san-diego-state/boxscore/15240","2023-01-25","Utah State @ San Diego State")
          }
          records={}
          for gid,(url,date,game) in sources.items():
              try:
                  resp=requests.get(url,timeout=35,headers={"User-Agent":"Mozilla/5.0"})
                  soup=BeautifulSoup(resp.text,"html.parser")
                  title=soup.title.get_text(" ",strip=True) if soup.title else ""
                  rows=[]
                  for tr in soup.select("tr"):
                      cells=[td.get_text(" ",strip=True) for td in tr.select("td,th")]
                      if len(cells)>=13 and (any(re.fullmatch(r"\d+\s*-\s*\d+",cell) for cell in cells) or "Totals" in cells):
                          rows.append(cells)
                  records[str(gid)]={"status":resp.status_code,"url":resp.url,"title":title,"game":game,"date":date,"rows":rows}
                  print("OFFICIAL_GAME",gid,"status",resp.status_code,"title",title,"rows",len(rows),flush=True)
                  for row in rows:
                      print("OFFICIAL_ROW",gid,json.dumps(row,ensure_ascii=False),flush=True)
                  if resp.status_code!=200 or len(rows)<12:raise RuntimeError(f"Source inaccessible or incomplete: {gid} {len(rows)}")
              except Exception as exc:
                  records[str(gid)]={"error":str(exc),"url":url}
                  print("OFFICIAL_ERROR",gid,str(exc),flush=True)
          with open("official-audit/source_player_rows.json","w") as out:
              json.dump(records,out,ensure_ascii=False,indent=2)
          if any("error" in v for v in records.values()):raise SystemExit("At least one source needs another retrieval path")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: college-last-four-official-tables
          path: official-audit/
