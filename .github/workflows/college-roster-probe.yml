name: College ESPN roster ID probe
on:
  push:
    branches: [college-import-pilot]
    paths: [".github/workflows/college-roster-probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe official ESPN athlete IDs for missing Colorado rows
        run: |
          python - <<'PY'
          import json, urllib.request
          base = "https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball"
          search = ("Tyler Bey","McKinley Wright","Evan Battey","D'Shawn Schwartz","Daylen Kountz","Eli Parquet","Namon Wright","Shane Gatling")
          urls = [f"{base}/teams/38/roster?season={s}" for s in (2019,2020,2018)]
          urls += [f"{base}/summary?event={e}" for e in (401087079,401173663)]
          for url in urls:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"}),timeout=18) as r:
                      data=json.load(r)
                  print("URL",url,"KEYS",list(data),"ROSTER_NAMES",[(a.get("fullName"),a.get("id")) for a in data.get("athletes") or [] if isinstance(a,dict)])
                  def explore(node,depth=0):
                      if isinstance(node,dict):
                          if "id" in node and ("fullName" in node or "displayName" in node):
                              name=str(node.get("fullName",node.get("displayName")))
                              if any(x.lower() in name.lower() for x in search):
                                  print("MATCH",name,node.get("id"),"TYPE",node.get("type"))
                          if depth < 15:
                              for key,value in node.items():
                                  if isinstance(value,(dict,list)): explore(value,depth+1)
                      elif isinstance(node,list):
                          for v in node: explore(v,depth+1)
                  explore(data)
              except Exception as e: print("ERROR",url,type(e).__name__,str(e)[:300])
          # Historical team rosters appear underpopulated. Use other games instead.
          for date in ("20181113","20181116","20181124","20181128","20181201"):
              try:
                  url=f"{base}/scoreboard?dates={date}&groups=50&limit=500"
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"}),timeout=20) as r: board=json.load(r)
                  events=[e for e in board.get("events",[]) if any(str(c.get("team",{}).get("id"))=="38" for comp in e.get("competitions",[]) for c in comp.get("competitors",[]))]
                  for event in events:
                      with urllib.request.urlopen(urllib.request.Request(f"{base}/summary?event={event['id']}",headers={"User-Agent":"Mozilla/5.0"}),timeout=20) as r: detail=json.load(r)
                      athletes=[]
                      for team in detail.get("boxscore",{}).get("players",[]):
                          if str(team.get("team",{}).get("id")) != "38": continue
                          for group in team.get("statistics",[]):
                              for a in group.get("athletes",[]):
                                  player=a.get("athlete",{})
                                  athletes.append((player.get("displayName"),player.get("id")))
                      print("GAME_ROSTER",date,event["id"],athletes)
              except Exception as e: print("ERROR_SCOREBOARD",date,str(e)[:200])
          with urllib.request.urlopen(urllib.request.Request(f"{base}/summary?event=401087079",headers={"User-Agent":"Mozilla/5.0"}),timeout=20) as r:
              detail=json.load(r)
          for team in detail.get("boxscore",{}).get("players",[]):
              if str(team.get("team",{}).get("id")) != "38": continue
              for g in team.get("statistics",[]):
                  for a in g.get("athletes",[]):
                      if not (a.get("athlete") or {}).get("id"):
                          print("UNKNOWN_ROW",str(a)[:900])
          print("SUMMARY_LEADERS",json.dumps(detail.get("leaders"))[:4800])
          PY