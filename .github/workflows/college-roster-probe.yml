name: College ESPN roster ID probe
on:
  push:
    branches: [college-import-pilot]
    paths: [".github/workflows/college-roster-probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe official ESPN athlete IDs for missing Colorado rows
        run: |
          python - <<'PY'
          import json, urllib.request
          base = "https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball"
          search = ("Tyler Bey","McKinley Wright","Evan Battey","D'Shawn Schwartz","Daylen Kountz","Eli Parquet","Namon Wright","Shane Gatling")
          urls = [f"{base}/teams/38/roster?season={s}" for s in (2019,2020,2018)]
          urls += [f"{base}/summary?event={e}" for e in (401087079,401173663)]
          for url in urls:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"}),timeout=18) as r:
                      data=json.load(r)
                  print("URL",url,"KEYS",list(data),"ATHLETES_SAMPLE",str(data.get("athletes"))[:2300])
                  def explore(node,depth=0):
                      if isinstance(node,dict):
                          if "id" in node and ("fullName" in node or "displayName" in node):
                              name=str(node.get("fullName",node.get("displayName")))
                              if any(x.lower() in name.lower() for x in search):
                                  print("MATCH",name,node.get("id"),"TYPE",node.get("type"))
                          if depth < 15:
                              for key,value in node.items():
                                  if isinstance(value,(dict,list)): explore(value,depth+1)
                      elif isinstance(node,list):
                          for v in node: explore(v,depth+1)
                  explore(data)
              except Exception as e: print("ERROR",url,type(e).__name__,str(e)[:300])
          PY