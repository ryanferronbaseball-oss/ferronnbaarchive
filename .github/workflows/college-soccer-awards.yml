name: College Soccer Awards Audit
on:
  workflow_dispatch:
    inputs:
      school:
        description: School to audit
        type: choice
        default: San Diego
        options:
          - San Diego
          - UCLA
          - UNLV
          - Cal Poly
          - UC Davis
          - Sacramento State
          - San Francisco
          - Portland
  push:
    branches: [main]
    paths:
      - '.github/workflows/college-soccer-awards.yml'
      - 'scripts/audit_college_soccer_awards.py'
      - 'college-soccer/data/awards_audit_sources.json'
permissions:
  contents: write
concurrency:
  group: college-soccer-awards
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile scripts/audit_college_soccer_awards.py
      - name: Collect official award evidence
        env:
          SCHOOL: ${{ inputs.school || 'San Diego' }}
        run: python scripts/audit_college_soccer_awards.py --school "$SCHOOL"
      - name: Publish audit evidence and checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-soccer/reports/awards college-soccer/reports/awards_audit_progress.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Collect college soccer award evidence"
          git pull --rebase origin main
          git push origin HEAD:main
