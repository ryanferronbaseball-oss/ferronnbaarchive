name: College Soccer Pro Career Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/college-soccer-pro-audit.yml'
      - 'scripts/audit_college_soccer_pro.py'
      - 'college-soccer/data/pro_audit_aliases.json'
permissions:
  contents: write
concurrency:
  group: college-soccer-pro-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python -m py_compile scripts/audit_college_soccer_pro.py
      - run: python scripts/audit_college_soccer_pro.py
      - name: Publish audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-soccer/reports/pro_career_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Screen college soccer players against senior professional leagues"
          git pull --rebase origin main
          git push origin HEAD:main
