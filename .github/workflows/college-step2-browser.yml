name: College Step 2 browser parity
on:
  push:
    branches: [college-import-pilot]
    paths:
      - ".github/workflows/college-step2-browser.yml"
      - "college/stats.html"
      - "college/player.html"
      - "college/data/player_boxscores_espn.json"
      - "college/data/team_names.json"
      - "college/scripts/test_step2_browser.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Real browser link, leaderboard and transfer tests
        run: python college/scripts/test_step2_browser.py
      - name: Upload screenshots and test results for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: college-step2-chromium-check
          path: college/output/step2-browser/
          if-no-files-found: warn
