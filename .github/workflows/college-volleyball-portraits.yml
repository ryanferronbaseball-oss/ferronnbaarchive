name: College volleyball school portraits
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'college-volleyball/data/school_portrait_targets.json'
      - 'scripts/audit_college_volleyball_portraits.py'
      - 'scripts/recover_volleyball_guide_portraits.py'
      - 'college-volleyball/data/portrait_pdf_sources.json'
      - '.github/workflows/college-volleyball-portraits.yml'
permissions:
  contents: write
concurrency:
  group: college-volleyball-portraits
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow beautifulsoup4 pymupdf
      - run: python -m py_compile scripts/audit_college_volleyball_portraits.py
      - run: python scripts/audit_college_volleyball_portraits.py
      - name: Publish verified portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-volleyball/data/player_portraits.json college-volleyball/reports/school_portrait_audit.json
          if [ -d college-volleyball/assets/portraits ]; then git add college-volleyball/assets/portraits; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover official college volleyball portraits"
          git pull --rebase origin main
          git push origin HEAD:main
