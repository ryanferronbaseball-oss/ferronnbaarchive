name: CSUN roster identity cleanup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/cleanup_csun_baseball_identities.py', '.github/workflows/csun-identity-cleanup.yml']
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m py_compile scripts/cleanup_csun_baseball_identities.py
      - run: python scripts/cleanup_csun_baseball_identities.py
      - name: Commit scoped merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_identity_crosswalk.json college-baseball/data/csun_identity_cleanup.json
          git commit -m "Merge two CSUN school spelling variants"
          git pull --rebase origin main
          git push origin HEAD:main
