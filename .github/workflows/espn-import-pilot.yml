name: ESPN alternative box score pilot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Test 2006, 2012, and 2018 ESPN historical box scores
        run: python scripts/import_espn.py --pilot
      - name: Commit results for inspection
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/espn_import_report.json data/player_boxscores_espn.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record ESPN alternative import pilot results"
            git push
          fi
