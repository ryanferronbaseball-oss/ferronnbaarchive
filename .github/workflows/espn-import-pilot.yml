name: ESPN historical box score full import
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/espn-import-pilot.yml'
      - 'data/games.csv'
permissions:
  contents: write
concurrency:
  group: courtside-espn-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requests
        run: python -m pip install requests
      - name: Import and validate all attendance box scores
        run: python scripts/import_espn.py
      - name: Commit validated data and import report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/espn_import_report.json data/player_boxscores_espn.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update ESPN full-history box score import results"
            git push
          fi
