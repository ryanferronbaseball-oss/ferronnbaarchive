name: Fullerton final three portrait recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/recover_fullerton_final_portraits.py', '.github/workflows/fullerton-final-portraits.yml']
permissions:
  contents: write
concurrency:
  group: college-baseball-portraits
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests pillow beautifulsoup4
      - run: node --check college-baseball/assets/archive.js
      - run: node --check scripts/export_fullerton_baseball_portrait_targets.cjs
      - run: python -m py_compile scripts/recover_fullerton_final_portraits.py
      - run: python scripts/recover_fullerton_final_portraits.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fullerton-final-portrait-report
          path: college-baseball/data/fullerton_portrait_followup.json
      - name: Publish verified portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_portraits.json college-baseball/data/fullerton_portrait_followup.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover three remaining Fullerton portraits from official bios"
          git pull --rebase origin main
          git push origin HEAD:main
