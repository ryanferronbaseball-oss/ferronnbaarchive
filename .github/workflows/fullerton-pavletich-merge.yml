name: Cal State Fullerton Jake Pavletich name and headshot correction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fullerton-pavletich-merge.yml']
permissions:
  contents: write
concurrency:
  group: college-baseball-portraits
  cancel-in-progress: false
jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests pillow beautifulsoup4 playwright
      - run: python -m playwright install --with-deps chromium
      - name: Merge owner-confirmed Jake Pavletich identities and verify existing headshot
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          from audit_player_portraits import probe
          D=Path('college-baseball/data')
          def load(n):return json.loads((D/n).read_text())
          def save(n,d):(D/n).write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          pid='cb-cal-state-fullerton-jake-pavletich'
          old='cb-cal-state-fullerton-jacob-pavletich'
          ids={pid,old,'cb-cal-state-fullerton-j-pavletich'}
          source='https://fullertontitans.com/sports/baseball/roster/jacob-pavletich/1838'
          before=hashlib.sha256((D/'player_stats.json').read_bytes()).hexdigest()
          rows=load('player_stats.json');reg=load('player_portraits.json');cross=load('player_identity_crosswalk.json')
          matches=[r for r in rows if r['player_id'] in ids]
          assert {r['player_id'] for r in matches}==ids and all(r['team']=='Cal State Fullerton' for r in matches)
          assert len({r['game_id'] for r in matches})==len(matches),'Same-game collision: review before merge'
          assert reg[pid]['source']==source and reg[pid]['provider']=='college'
          assert probe(reg[pid]['url'])[0]=='image','Existing portrait unavailable'
          existing=[m for m in cross['merges'] if ids.intersection(m['source_player_ids'])]
          assert len(existing)==1 and existing[0]['canonical_id']==pid
          m=existing[0]
          assert set(m['source_player_ids']) in ({pid,'cb-cal-state-fullerton-j-pavletich'},ids)
          m.update({'name':'Jake Pavletich','display_name':'Jake Pavletich','source_player_ids':sorted(ids),'pairs':[{'team':'Cal State Fullerton','source_player_id':i} for i in sorted(ids)],'source_rows':len(matches),'note':'Owner confirmed Jacob/Jake/J. Pavletich are the same Fullerton player. All raw game logs retained.','evidence_urls':[source]})
          assert before==hashlib.sha256((D/'player_stats.json').read_bytes()).hexdigest()
          report={'id':pid,'display_name':'Jake Pavletich','source_ids':sorted(ids),'games':sorted({r['game_id'] for r in matches}),'source_rows':len(matches),'portrait':reg[pid],'added':[]}
          save('player_identity_crosswalk.json',cross);save('fullerton_pavletich_correction.json',report)
          PY
      - name: Verify Cal State Fullerton coverage and canonical name
        run: |
          node scripts/export_baseball_portrait_preferences.cjs 'Cal State Fullerton' > /tmp/duke.json
          python - <<'PY'
          import json
          from pathlib import Path
          D=Path('college-baseball/data')
          p=json.load(open('/tmp/duke.json'));reg=json.loads((D/'player_portraits.json').read_text())
          a=[x for x in p if x['id']=='cb-cal-state-fullerton-jake-pavletich']
          assert len(a)==1 and a[0]['name']=='Jake Pavletich',a
          assert not any(x['id'] in ('cb-cal-state-fullerton-jacob-pavletich','cb-cal-state-fullerton-j-pavletich') for x in p)
          report=json.loads((D/'fullerton_pavletich_correction.json').read_text());report['coverage']={'players':len(p),'portraits':sum(x['id'] in reg for x in p)}
          (D/'fullerton_pavletich_correction.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Verify Jake Pavletich profile on desktop and mobile
        run: |
          python - <<'PY'
          import json,threading,http.server,functools
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          from urllib.parse import quote
          root=Path.cwd();D=root/'college-baseball/data'
          reg=json.loads((D/'player_portraits.json').read_text())
          report=json.loads((D/'fullerton_pavletich_correction.json').read_text())
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),functools.partial(http.server.SimpleHTTPRequestHandler,directory=str(root)))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          results=[]
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for mode,w,h in [('desktop',1360,900),('mobile',390,844)]:
                  page=browser.new_page(viewport={'width':w,'height':h})
                  for pid in [report['id']]:
                      page.goto(f'http://127.0.0.1:{server.server_port}/college-baseball/player.html?id='+quote(pid),wait_until='domcontentloaded',timeout=30000)
                      frame=page.locator('.cb-player-portrait')
                      frame.wait_for(state='visible',timeout=15000)
                      page.wait_for_function("() => {const i=document.querySelector('.cb-player-portrait img');return i&&i.complete&&i.naturalWidth>0&&i.parentElement.classList.contains('has-portrait')}",timeout=15000)
                      actual=frame.locator('img').evaluate('i=>i.currentSrc')
                      assert actual==reg[pid]['url'],(pid,actual)
                      results.append({'id':pid,'viewport':mode,'status':'pass'})
                      print(pid,mode,'pass',flush=True)
                  page.close()
              browser.close()
          server.shutdown()
          report['render_checks']=results
          (D/'fullerton_pavletich_correction.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Publish verified corrections (retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_identity_crosswalk.json college-baseball/data/fullerton_pavletich_correction.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Consolidate Jacob and J. Pavletich into Jake Pavletich; retain official headshot"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
