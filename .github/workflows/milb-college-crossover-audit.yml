name: MiLB to College Baseball attendance identity audit
on:
  workflow_dispatch:
  push:
    paths:
      - "milb/scripts/audit_college_milb.py"
      - ".github/workflows/milb-college-crossover-audit.yml"
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Analyze actual college profiles, including confirmed identity merges
        run: python milb/scripts/audit_college_milb.py
      - name: Save full name-match candidate review
        uses: actions/upload-artifact@v4
        with:
          name: milb-college-crossover-candidates
          path: milb/data/college_match_review.json
      - name: Publish candidate review only — never apply unverified tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add milb/data/college_match_review.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit College Baseball profile overlaps with MiLB attendance"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
