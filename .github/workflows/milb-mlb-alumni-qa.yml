name: MiLB to MLB college page parity
on:
  workflow_dispatch:
  push:
    paths:
      - "milb/assets/mlb-alumni.js"
      - "milb/assets/mlb-alumni.css"
      - "milb/mlb-alumni.html"
      - "milb/scripts/test_mlb_alumni.py"
      - ".github/workflows/milb-mlb-alumni-qa.yml"
jobs:
  alumni:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate MiLB directory JavaScript
        run: node --check milb/assets/mlb-alumni.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Check alumni, draft sorting, attended-game logs and isolation
        run: python milb/scripts/test_mlb_alumni.py
