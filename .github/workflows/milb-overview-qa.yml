name: MiLB overview MLB layout parity
on:
  workflow_dispatch:
  push:
    paths:
      - "milb/assets/overview.js"
      - "milb/assets/overview.css"
      - "milb/index.html"
      - "milb/scripts/test_milb_overview.py"
      - ".github/workflows/milb-overview-qa.yml"
jobs:
  overview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check overview JavaScript syntax
        run: |
          node --check milb/assets/overview.js
          node --check milb/assets/archive.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Verify overview and all filters in Chromium
        run: python milb/scripts/test_milb_overview.py
