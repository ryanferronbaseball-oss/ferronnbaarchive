name: MiLB Players MLB-layout parity
on:
  workflow_dispatch:
  push:
    paths:
      - "milb/assets/players.js"
      - "milb/assets/players.css"
      - "milb/assets/archive.js"
      - "milb/stats.html"
      - "milb/scripts/test_milb_players.py"
      - ".github/workflows/milb-players-qa.yml"
jobs:
  players:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify MiLB JavaScript syntax
        run: |
          node --check milb/assets/archive.js
          node --check milb/assets/players.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Compare player search, leaderboards and independent data sources in browser
        run: python milb/scripts/test_milb_players.py
