name: MiLB player profile MLB parity
on:
  workflow_dispatch:
  push:
    paths:
      - "milb/assets/profile.js"
      - "milb/assets/profile.css"
      - "milb/player.html"
      - "milb/scripts/test_milb_profiles.py"
      - ".github/workflows/milb-profile-qa.yml"
jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify JavaScript syntax
        run: |
          node --check milb/assets/profile.js
          node --check milb/assets/archive.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Check MiLB player profiles in Chromium, including mobile
        run: python milb/scripts/test_milb_profiles.py
