name: MiLB records MLB layout parity
on:
  workflow_dispatch:
  push:
    paths:
      - "milb/assets/records.js"
      - "milb/assets/records.css"
      - "milb/records.html"
      - "milb/scripts/test_milb_records.py"
      - ".github/workflows/milb-records-qa.yml"
jobs:
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify MiLB records JavaScript syntax
        run: |
          node --check milb/assets/records.js
          node --check milb/assets/archive.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Check records in Chromium including mobile
        run: python milb/scripts/test_milb_records.py
