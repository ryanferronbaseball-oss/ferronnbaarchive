name: Inspect official MLB awards API
on:
  workflow_dispatch:
  push:
    paths:
      - mlb/scripts/inspect_awards.py
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python mlb/scripts/inspect_awards.py
      - name: Save inspect report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mlb/data/award_catalog_probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Record MLB awards API endpoints for source-verified honors"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
