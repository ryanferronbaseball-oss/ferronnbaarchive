name: MLB witnessed milestones audit batch 1
on:
  push:
    paths:
      - '.github/workflows/mlb-milestone-batch-1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit first 100 players
        run: python mlb/scripts/audit_witnessed_milestones.py --batch 1
      - name: Upload audit candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlb-milestone-batch-001
          path: mlb/data/witnessed_milestone_audit_batch_001.json
      - name: Commit audit candidate results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mlb/data/witnessed_milestone_audit_batch_001.json
          if ! git diff --cached --quiet; then
            git commit -m "Record MLB milestone audit batch 1 candidates"
            git push
          fi
