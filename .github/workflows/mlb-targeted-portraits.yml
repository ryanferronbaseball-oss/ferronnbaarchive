name: MLB targeted portrait audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/audit_mlb_targeted_portraits.py', 'mlb/data/portrait_coaching_sources.json', '.github/workflows/mlb-targeted-portraits.yml']
permissions:
  contents: write
concurrency:
  group: player-portrait-backfill
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow beautifulsoup4
      - run: python scripts/audit_mlb_targeted_portraits.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-targeted-portrait-audit
          path: reports/player_portrait_audit.json
      - name: Publish verified portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mlb/data/player_portrait_fallbacks.json reports/player_portrait_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add targeted historical MLB portraits from official and reference sources"
          git pull --rebase origin main
          git push origin HEAD:main
