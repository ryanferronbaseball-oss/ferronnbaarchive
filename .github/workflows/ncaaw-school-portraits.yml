name: Women's basketball school portrait audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/audit_ncaaw_school_portraits.py', 'college-women/data/school_portrait_targets.json', '.github/workflows/ncaaw-school-portraits.yml']
permissions:
  contents: write
concurrency:
  group: ncaaw-school-portraits
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow beautifulsoup4
      - run: python scripts/audit_ncaaw_school_portraits.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncaaw-school-portrait-audit
          path: college-women/reports/school_portrait_audit.json
      - name: Publish verified portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-women/data/player_headshots.json college-women/reports/school_portrait_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add verified women's basketball school portraits"
          git pull --rebase origin main
          git push origin HEAD:main
