name: NFL full-PPR milestone data
on:
  push:
    branches: [nfl-fantasy-ppr-milestones]
    paths:
      - "nfl/scripts/build_fantasy_ppr.py"
      - ".github/workflows/nfl-fantasy-ppr-build.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nfl-fantasy-ppr-milestones
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute traditional Full-PPR scores and guard new scoring cases
        run: python nfl/scripts/build_fantasy_ppr.py
      - name: Commit source-traceable personal game PPR scores
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl/data/fantasy_ppr.json
          if ! git diff --cached --quiet; then
            git commit -m "Populate verified NFL Full-PPR performances and milestone counts"
            git push origin HEAD:nfl-fantasy-ppr-milestones
          fi
