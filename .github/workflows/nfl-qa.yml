name: NFL archive browser QA
on:
  push:
    branches: [nfl-three-game-import, nfl-scoring-plays-and-leaderboards, nfl-fantasy-ppr-milestones, main]
    paths:
      - "nfl/**"
      - "index.html"
      - ".github/workflows/nfl-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nfl-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - run: python nfl/scripts/test_nfl.py
      - name: Upload PPR milestone page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-fantasy-ppr-review
          path: nfl/output/ppr/
          if-no-files-found: ignore
