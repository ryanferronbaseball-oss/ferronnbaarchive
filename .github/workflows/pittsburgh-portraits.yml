name: Pittsburgh witnessed-player portrait audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pittsburgh-portraits.yml']
permissions:
  contents: write
concurrency:
  group: college-baseball-portraits
  cancel-in-progress: false
jobs:
  portraits:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests pillow beautifulsoup4 playwright
      - run: python -m playwright install chromium
      - name: Match witnessed Pittsburgh players to official roster portraits
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import json,re,subprocess,collections
          from urllib.parse import urlsplit,parse_qs,urlencode
          from bs4 import BeautifulSoup
          from audit_player_portraits import load,save,get,probe
          from recover_lsu_final_portraits import norm,host,photo_year
          SCHOOL='Pittsburgh'
          HOST='pittsburghpanthers.com'
          REG='college-baseball/data/player_portraits.json'
          REPORT='college-baseball/data/pittsburgh_portrait_recovery.json'
          targets={
           'cb-pittsburgh-c-j-funk':('https://pittsburghpanthers.com/sports/baseball/roster/cj-funk/13057',2024,'CJ Funk Headhsot'),
           'cb-pittsburgh-matthew-fernandez':('https://pittsburghpanthers.com/sports/baseball/roster/matthew-fernandez/13055',2024,'Matt Fernandez Headshot'),
           'cb-pittsburgh-david-pedanou':('https://pittsburghpanthers.com/sports/baseball/roster/david-pedanou/13964',2025,'Pedanou Headshot')}
          players=json.loads(subprocess.check_output(['node','scripts/export_baseball_portrait_preferences.cjs',SCHOOL],text=True))
          players=[p for p in players if p['id'] in targets]
          assert len(players)==3,'Target identity mismatch'
          registry=load(REG,{})
          report={'school':SCHOOL,'targeted':len(players),'targets':[{k:p[k] for k in ('id','name','schools','preference')} for p in players],'added':[],'upgraded':[],'preserved':[],'missing':[],'notes':[]}
          found={}
          for p in players:
              cid=p['id'];source,y,alt=targets[cid]
              if cid in registry:continue
              try:
                  r=get(source);r.raise_for_status()
                  if host(r.url)!=HOST or urlsplit(r.url).path.rstrip('/')!=urlsplit(source).path.rstrip('/'):raise ValueError('Unexpected biography redirect')
                  soup=BeautifulSoup(r.text,'html.parser')
                  heading=' '.join(t.get_text(' ',strip=True) for t in soup.find_all(['h1','h2','title']))
                  if norm(p['name']) not in norm(heading) or not re.search(r'\b'+str(y)+r'\s+Baseball\s+Roster',heading,re.I):raise ValueError('Identity or season not confirmed: '+heading[:300])
                  matches=[]
                  for im in soup.find_all('img'):
                      if norm(im.get('alt',''))!=norm(alt):continue
                      for key in ('src','data-src','data-lazy-src'):
                          u=im.get(key,'')
                          q=parse_qs(urlsplit(u).query)
                          if host(u)!='images.sidearmdev.com' or urlsplit(u).path!='/crop' or q.get('width')!=['180'] or q.get('height')!=['270']:continue
                          base=q.get('url',[''])[0]
                          if not base.startswith('https://') or not host(base).endswith('.cloudfront.net') or '/pittsburghpanthers.com/images/' not in urlsplit(base).path:continue
                          matches.append((u,base))
                  if len(set(matches))!=1:raise ValueError('No unique verified headshot crop')
                  original,base=matches[0]
                  enlarged='https://images.sidearmdev.com/crop?'+urlencode({'url':base,'width':603,'height':803,'type':'webp'})
                  for u in (enlarged,original):
                      state,digest=probe(u)
                      if state=='image' and digest:
                          found[cid]=({'url':u,'source':source,'provider':'college','school':SCHOOL,'season':y,'photo_year':photo_year(base,y)},digest)
                          break
                  if cid not in found:raise ValueError('Portrait did not resolve')
              except Exception as e:report['notes'].append({'id':cid,'error':str(e)})
          hashes=collections.Counter(d for _,d in found.values())
          for p in players:
              cid=p['id'];entry={'id':cid,'name':p['name']}
              if cid in registry:report['preserved'].append(entry);continue
              if cid not in found or hashes[found[cid][1]]!=1:
                  report['missing'].append(entry);continue
              registry[cid]=found[cid][0]
              report['added'].append({**entry,**registry[cid]})
          report['registered_portraits']=sum(p['id'] in registry for p in players)
          save(REG,registry);save(REPORT,report)
          print(json.dumps(report,indent=2))
          PY
      - name: Verify Pittsburgh portrait rendering only
        run: |
          python - <<'PY'
          import json,pathlib,threading,functools,http.server
          from urllib.parse import quote
          from playwright.sync_api import sync_playwright
          from PIL import Image,ImageDraw
          root=pathlib.Path.cwd()
          report=json.loads((root/'college-baseball/data/pittsburgh_portrait_recovery.json').read_text())
          out=root/'pittsburgh-visual-review';out.mkdir(exist_ok=True)
          server=http.server.ThreadingHTTPServer(('127.0.0.1',0),functools.partial(http.server.SimpleHTTPRequestHandler,directory=str(root)))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          results=[]
          registry=json.loads((root/'college-baseball/data/player_portraits.json').read_text())
          with sync_playwright() as p:
              browser=p.chromium.launch()
              for mode,w,h in [('desktop',1360,900),('mobile',390,844)]:
                  page=browser.new_page(viewport={'width':w,'height':h},device_scale_factor=1)
                  for t in report['targets']:
                      pid=t['id'];row={'id':pid,'name':t['name'],'viewport':mode}
                      if pid not in registry:
                          row['status']='missing';results.append(row);print(mode,t['name'],'missing; skipped browser timeout',flush=True);continue
                      try:
                          page.goto(f'http://127.0.0.1:{server.server_port}/college-baseball/player.html?id='+quote(pid),wait_until='domcontentloaded',timeout=30000)
                          frame=page.locator('.cb-player-portrait')
                          frame.wait_for(state='visible',timeout=15000)
                          page.wait_for_function("() => {const i=document.querySelector('.cb-player-portrait img');return i&&i.complete&&i.naturalWidth>0&&i.parentElement.classList.contains('has-portrait')}",timeout=12000)
                          row.update(frame.locator('img').evaluate("i=>({url:i.currentSrc,natural:[i.naturalWidth,i.naturalHeight],fit:getComputedStyle(i).objectFit,position:getComputedStyle(i).objectPosition})"))
                          selected=registry[pid]['url']
                          if pid in {x['id'] for x in report['added']+report['upgraded']} and row['url']!=selected:raise ValueError('New portrait did not render; fallback used')
                          frame.screenshot(path=str(out/f'{mode}-{pid}.png'),timeout=10000)
                          if row['fit']!='cover' or row['position']!='50% 0%':raise ValueError('Unexpected portrait framing')
                          row['status']='pass'
                      except Exception as e:row['status']='fail';row['error']=str(e)
                      results.append(row)
                      print(mode,t['name'],row['status'],row.get('natural'),flush=True)
                  page.close()
                  cols=7;sheet=Image.new('RGB',(cols*180,((len(report['targets'])+cols-1)//cols)*220),'#f5f5f5')
                  draw=ImageDraw.Draw(sheet)
                  for n,t in enumerate(report['targets']):
                      f=out/f"{mode}-{t['id']}.png";x,y=n%cols*180,n//cols*220
                      if f.exists():
                          im=Image.open(f).convert('RGB');im.thumbnail((165,185));sheet.paste(im,(x+(180-im.width)//2,y+5))
                      else:draw.text((x+8,y+80),'MISSING / FAILED',fill='red')
                      draw.text((x+4,y+192),t['name'],fill='black')
                  sheet.save(out/f'{mode}-contact-sheet.jpg')
              browser.close()
          server.shutdown()
          (out/'results.json').write_text(json.dumps(results,indent=2))
          failed={r['id'] for r in results if r['status']!='pass'}
          print(f'Verified {len(results)-sum(r["status"]!="pass" for r in results)}/{len(results)} viewport checks; {len(failed)} player profiles need follow-up')
          # Do not publish any newly selected portrait that failed real rendering.
          regpath=root/'college-baseball/data/player_portraits.json'
          registry=json.loads(regpath.read_text())
          for x in report['added']+report['upgraded']:
              if x['id'] not in failed:continue
              previous=registry[x['id']].get('fallbacks',[])
              if previous:
                  registry[x['id']]=previous[0]
                  if len(previous)>1:registry[x['id']]['fallbacks']=previous[1:]
              else:registry.pop(x['id'],None)
          for key in ('added','upgraded'):
              report[key]=[x for x in report[key] if x['id'] not in failed]
          report['render_failures']=sorted(failed)
          report['registered_portraits']=sum(t['id'] in registry for t in report['targets'])
          regpath.write_text(json.dumps(registry,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          (root/'college-baseball/data/pittsburgh_portrait_recovery.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pittsburgh-portrait-review
          path: |
            pittsburgh-visual-review/
            college-baseball/data/pittsburgh_portrait_recovery.json
      - name: Publish verified Pittsburgh portrait changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/player_portraits.json college-baseball/data/pittsburgh_portrait_recovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add verified Pittsburgh witnessed-player portraits"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
