name: SDSU WMT portrait source diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/diagnose_sdsu_portrait_sources.py', '.github/workflows/sdsu-portrait-diagnostics.yml']
permissions:
  contents: write
concurrency:
  group: sdsu-portrait-diagnostics
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install requests pillow beautifulsoup4
      - run: node --check college-baseball/assets/archive.js
      - run: node --check scripts/export_sdsu_baseball_portrait_targets.cjs
      - run: python -m py_compile scripts/diagnose_sdsu_portrait_sources.py
      - run: python scripts/diagnose_sdsu_portrait_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdsu-baseball-portrait-audit
          path: college-baseball/data/sdsu_portrait_diagnostics.json
      - name: Publish verified portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/sdsu_portrait_diagnostics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record actual SDSU roster and bio image metadata"
          git pull --rebase origin main
          git push origin HEAD:main
