name: Soccer official club portrait backfill
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/audit_soccer_official_portraits.py', 'soccer/data/portrait_official_sources.json', '.github/workflows/soccer-official-portraits.yml']
permissions:
  contents: write
concurrency:
  group: player-portrait-backfill
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pillow beautifulsoup4
      - run: python scripts/audit_soccer_official_portraits.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soccer-official-portrait-audit
          path: reports/player_portrait_audit.json
      - name: Publish verified portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add soccer/data/player_portraits.json reports/player_portrait_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add official soccer player portrait references"
          git pull --rebase origin main
          git push origin HEAD:main
