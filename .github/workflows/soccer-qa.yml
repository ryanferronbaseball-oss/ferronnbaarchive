name: Soccer archive browser QA
on:
  workflow_dispatch:
  push:
    paths:
      - "soccer/**"
      - "index.html"
      - ".github/workflows/soccer-qa.yml"
jobs:
  soccer-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Test official 3-match soccer records, navigation and mobile
        run: python soccer/scripts/test_soccer.py
