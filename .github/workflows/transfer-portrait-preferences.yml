name: College baseball transfer portrait preference audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/export_baseball_portrait_preferences.cjs', 'scripts/audit_transfer_portrait_preferences.py', '.github/workflows/transfer-portrait-preferences.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: node --check college-baseball/assets/archive.js
      - run: node --check scripts/export_baseball_portrait_preferences.cjs
      - run: python scripts/audit_transfer_portrait_preferences.py
      - name: Save preference report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add college-baseball/data/transfer_portrait_preference_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit portrait schools against witnessed transfer playing time"
          git pull --rebase origin main
          git push origin HEAD:main
