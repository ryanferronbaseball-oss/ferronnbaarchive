name: Shared stadium directory and MiLB venue QA
on:
  workflow_dispatch:
  push:
    paths:
      - "venues/data/venues.json"
      - "venues/venues.js"
      - "venues/scripts/test_venues.mjs"
      - "venues/scripts/test_milb_venues.py"
      - "assets/venue-map.js"
      - "milb/data/games.json"
      - ".github/workflows/venue-milb-qa.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check venue and MiLB game integrity
        run: |
          node --check venues/venues.js
          node --check assets/venue-map.js
          node --check milb/assets/games.js
          node venues/scripts/test_venues.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Verify all four MiLB venue profiles in Chromium
        run: python venues/scripts/test_milb_venues.py
